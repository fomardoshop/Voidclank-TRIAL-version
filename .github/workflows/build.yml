name: Build VST3

on:
  push:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure (Windows)
        if: runner.os == 'Windows'
        run: cmake -B build -A x64

      - name: Configure (macOS, universal arm64 + Intel)
        if: runner.os == 'macOS'
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Upload VST3 (Windows)
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: Voidclank-Windows-VST3
          path: build/Voidclank_artefacts/Release/VST3/

      - name: Upload Standalone (Windows)
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: Voidclank-Windows-Standalone
          path: build/Voidclank_artefacts/Release/Standalone/

      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: |
          mkdir -p out
          ditto -c -k --keepParent build/Voidclank_artefacts/Release/VST3/Voidclank.vst3 out/Voidclank-macOS-VST3.zip
          ditto -c -k --keepParent build/Voidclank_artefacts/Release/Standalone/Voidclank.app out/Voidclank-macOS-Standalone.zip

      - name: Upload (macOS)
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: Voidclank-macOS
          path: out/
